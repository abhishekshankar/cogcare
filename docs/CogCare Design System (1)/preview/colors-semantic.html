<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-bg); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .token { border-radius: 12px; padding: 14px 12px 10px; border: 1px solid rgba(0,0,0,0.05); }
  .token-name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 6px; }
  .token-value { font-size: 10px; font-family: monospace; opacity: 0.6; }
  .token-preview { height: 32px; border-radius: 8px; margin-bottom: 8px; }
  .group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-clay); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="group-label">UI Semantic Colors</div>
<div class="row">
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#3D4B3E"></div>
    <div class="token-name" style="color:#3D4B3E">--color-primary</div>
    <div class="token-value">#3D4B3E</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#2D382D"></div>
    <div class="token-name" style="color:#2D382D">--color-primary-hover</div>
    <div class="token-value">#2D382D</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#A67B5B"></div>
    <div class="token-name" style="color:#A67B5B">--color-accent</div>
    <div class="token-value">#A67B5B</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#FDFBF7; border:1px solid #e0dbd2"></div>
    <div class="token-name" style="color:#666">--color-bg-page</div>
    <div class="token-value">#FDFBF7</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#FFFFFF; border:1px solid #e8dcc4"></div>
    <div class="token-name" style="color:#666">--color-bg-card</div>
    <div class="token-value">#FFFFFF</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#F3EFE9"></div>
    <div class="token-name" style="color:#666">--color-bg-surface</div>
    <div class="token-value">#F3EFE9</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#E8DCC4"></div>
    <div class="token-name" style="color:#666">--color-border</div>
    <div class="token-value">#E8DCC4</div>
  </div>
  <div class="token" style="background:white">
    <div class="token-preview" style="background:#991B1B"></div>
    <div class="token-name" style="color:#991B1B">--color-error</div>
    <div class="token-value">#991B1B</div>
  </div>
</div>

<div class="group-label">Gradients</div>
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
  <div style="height:48px; border-radius:12px; background:linear-gradient(135deg,#1A3C34 0%,#3D4B3E 50%,#1A3C34 100%); display:flex;align-items:center;justify-content:center;">
    <span style="font-size:9px;color:white;font-weight:700;letter-spacing:0.15em;text-transform:uppercase">gradient-primary</span>
  </div>
  <div style="height:48px; border-radius:12px; background:linear-gradient(135deg,#4A7C59 0%,#5A9C69 100%); display:flex;align-items:center;justify-content:center;">
    <span style="font-size:9px;color:white;font-weight:700;letter-spacing:0.15em;text-transform:uppercase">gradient-accent</span>
  </div>
  <div style="height:48px; border-radius:12px; background:linear-gradient(to top, rgba(0,0,0,0.85), transparent); display:flex;align-items:flex-end;padding:10px;">
    <span style="font-size:9px;color:white;font-weight:700;letter-spacing:0.15em;text-transform:uppercase">photo vignette</span>
  </div>
</div>
</body>
</html>
