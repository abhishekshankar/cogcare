<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-clay); margin-bottom: 10px; margin-top: 16px; }
  .field { margin-bottom: 12px; }
  .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-clay); margin-bottom: 6px; }
  input, textarea {
    width: 100%; box-sizing: border-box;
    padding: 12px 16px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--color-ink);
    outline: none;
  }
  input:focus { border-color: var(--color-forest); box-shadow: 0 0 0 3px rgba(61,75,62,0.12); }
  .form-card { background: white; border: 1px solid var(--color-border); border-radius: 24px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(26,60,52,0.05); max-width: 360px; }
  .helper { font-size: 11px; color: rgba(61,75,62,0.65); margin-top: 5px; }
  .error { font-size: 12px; color: #991B1B; margin-top: 4px; }
</style>
</head>
<body>
<div class="group-label">Form Card</div>
<div class="form-card">
  <div class="field">
    <div class="field-label">Email</div>
    <input type="email" placeholder="you@example.com" value="">
  </div>
  <div class="field">
    <div class="field-label">Password</div>
    <input type="password" placeholder="••••••••" value="">
    <div class="helper">At least 8 characters. Include uppercase, lowercase, a number, and a symbol.</div>
  </div>
  <div class="field">
    <div class="field-label">Confirm password</div>
    <input type="password" placeholder="••••••••" style="border-color:#fecaca">
    <div class="error">Passwords do not match.</div>
  </div>
  <button style="width:100%;padding:14px;background:#3D4B3E;color:white;border-radius:9999px;border:none;font-family:var(--font-sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;cursor:pointer;margin-top:4px">
    Create Account
  </button>
</div>

<div class="group-label">Avatar Upload</div>
<div style="display:flex;align-items:center;gap:14px;max-width:360px">
  <div style="width:56px;height:56px;border-radius:9999px;background:#F3EFE9;border:1px solid #E8DCC4;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(61,75,62,0.4);font-weight:700;text-transform:uppercase">N</div>
  <div style="display:flex;gap:8px">
    <label style="padding:8px 16px;background:#3D4B3E;color:white;border-radius:9999px;font-family:var(--font-sans);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer">Upload</label>
    <button style="padding:8px 16px;background:transparent;color:#3D4B3E;border:1px solid #E8DCC4;border-radius:9999px;font-family:var(--font-sans);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer">Remove</button>
  </div>
</div>
</body>
</html>
