<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); }
  .divider { height: 1px; background: var(--color-border); margin: 18px 0; }
  .meta { font-family: var(--font-sans); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-clay); margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="meta">Display / H1</div>
  <div style="font-family:var(--font-serif);font-size:clamp(2.5rem,6vw,5rem);font-weight:400;line-height:1.05;letter-spacing:-0.02em;color:var(--color-ink)">
    Dementia is <em style="color:var(--color-forest);font-style:italic">Modifiable.</em>
  </div>

  <div class="divider"></div>
  <div class="meta">Display / H2</div>
  <div style="font-family:var(--font-serif);font-size:clamp(1.8rem,4vw,3rem);font-weight:400;line-height:1.1;letter-spacing:-0.02em;color:var(--color-ink)">
    Dementia Does Not <em style="color:var(--color-forest);font-style:italic">Differentiate.</em>
  </div>

  <div class="divider"></div>
  <div class="meta">Display / H3</div>
  <div style="font-family:var(--font-serif);font-size:1.875rem;font-weight:400;line-height:1.25;color:var(--color-ink)">
    Brain credit — your cognitive wellness score.
  </div>

  <div class="divider"></div>
  <div class="meta">Panel Title (italic)</div>
  <div style="font-family:var(--font-serif);font-size:1.5rem;font-style:italic;font-weight:400;color:var(--color-forest)">
    CogCare<span style="font-family:var(--font-sans);font-size:0.875rem;font-style:normal;font-weight:500;color:var(--color-clay);opacity:0.8;margin-left:2px">.org</span>
  </div>

  <div class="divider"></div>
  <div class="meta">Stat / Score display</div>
  <div style="font-family:var(--font-serif);font-size:4.5rem;font-weight:400;color:var(--color-forest);display:flex;align-items:baseline;gap:4px">
    740<span style="font-size:1.5rem;font-style:italic">pts</span>
  </div>

</body>
</html>
