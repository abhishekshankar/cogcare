<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CogCare Report -- Wireframes v1+v2</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  /* Wireframe primitives */
  .wf-box { background: #F4F2EE; border: 1.5px solid #C8C2B8; border-radius: 4px; }
  .wf-box-dark { background: #D9D4CC; border: 1.5px solid #B0A89C; border-radius: 4px; }
  .wf-box-accent { background: #E8F0EB; border: 1.5px dashed #88A890; border-radius: 4px; }
  .wf-box-warn { background: #FDF4EC; border: 1.5px dashed #D4A060; border-radius: 4px; }
  .wf-box-cta { background: #C8D4CA; border: 1.5px solid #6A8870; border-radius: 6px; }
  .wf-text { background: #E2DED8; border-radius: 2px; height: 8px; }
  .wf-text-sm { background: #E8E4DE; border-radius: 2px; height: 6px; }
  .wf-img { background: repeating-linear-gradient(45deg, #D4CFC8, #D4CFC8 2px, #E4DFD8 2px, #E4DFD8 10px); border-radius: 3px; }

  .section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em;
    color: #8A7A6A; margin-bottom: 6px; display: block;
  }
  .flag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #FEF3E8; border: 1px solid #E8B060; border-radius: 9999px;
    padding: 2px 8px; font-size: 9px; font-weight: 700; color: #9A5820;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .note-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #EDF5F0; border: 1px solid #8DC4A0; border-radius: 9999px;
    padding: 2px 8px; font-size: 9px; font-weight: 600; color: #2A6A42;
  }

  /* Connector lines */
  .connector { height: 1px; background: #C0B8AE; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// --- Wireframe building blocks ---------------------------------------------
const WF = {
  // A labeled content row
  Row({ label, height = 28, style = {}, cls = 'wf-box', children, flag }) {
    return (
      <div style={{ marginBottom: 6, ...style }}>
        {label && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
            <span className="section-label" style={{ marginBottom: 0 }}>{label}</span>
            {flag && <span className="flag"> clinician review</span>}
          </div>
        )}
        <div className={cls} style={{ height, padding: children ? 8 : 0, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          {children}
        </div>
      </div>
    );
  },

  // A text skeleton line
  TextLine({ width = '100%', style = {} }) {
    return <div className="wf-text" style={{ width, marginBottom: 5, ...style }} />;
  },

  // A grid
  Grid({ cols, gap = 6, children, style = {} }) {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: `repeat(${cols}, 1fr)`, gap, ...style }}>
        {children}
      </div>
    );
  },

  // A card
  Card({ height, cls = 'wf-box', style = {}, children }) {
    return (
      <div className={cls} style={{ height, padding: 8, ...style }}>
        {children}
      </div>
    );
  },

  // Separator with label
  Sep({ label }) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '8px 0 10px' }}>
        <div style={{ flex: 1, height: 1, background: '#C8C2B8' }} />
        {label && <span style={{ fontSize: 9, color: '#A09080', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.15em' }}>{label}</span>}
        <div style={{ flex: 1, height: 1, background: '#C8C2B8' }} />
      </div>
    );
  },

  // Badge
  Badge({ text, cls = 'note-tag' }) {
    return <span className={cls} style={{ alignSelf: 'flex-start' }}>{text}</span>;
  }
};

// --- V1 Short Form Wireframe ----------------------------------------------

            { label: 'Language', level: 'Moderate', cls: 'wf-box' },

      <WF.Sep label="5 of 8 sections" />

              </div>

      </WF.Row>

      <WF.Sep label="6 of 8 sections" />

      {/* 6. Primary CTA */}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center' }}>
          <div style={{ width: '85%', height: 36, borderRadius: 9999, background: 'rgba(255,255,255,0.7)', border: '1.5px solid rgba(100,140,110,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

      </WF.Row>

      <WF.Sep label="7 of 8 sections" />

      {/* 7. Share actions */}
      <WF.Row label=" Save/share -- 3 equal-weight actions" height={64}>
        <WF.Grid cols={3} gap={6}>
          {['Download PDF', 'Email family', 'Send to doctor'].map(l => (

              <div className="wf-box-dark" style={{ width: 20, height: 20, borderRadius: 4 }} />

              <WF.TextLine width="50%" style={{ height: 5, marginBottom: 0 }} />
            </div>
          ))}
        </WF.Grid>
      </WF.Row>

      <WF.Sep label="8 of 8 sections" />

      {/* 8. Soft secondary */}
      <WF.Row label=" Soft secondary -- caregiver guide + email capture" height={60} cls="wf-box" style={{ borderStyle: 'dashed' }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <WF.TextLine width="60%" />
          <WF.TextLine width="75%" style={{ height: 6 }} />

          </div>
        </div>
      </WF.Row>

          <div style={{ display: 'flex', gap: 10, marginBottom: 12, flexWrap: 'wrap' }}>
            {['Clinician-backed', 'HIPAA-compliant', '[N] caregivers helped'].map(t => (
              <div key={t} className="wf-box-accent" style={{ padding: '4px 10px', borderRadius: 9999, display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#8DC4A0' }} />
                <div className="wf-text-sm" style={{ width: 70, marginBottom: 0 }} />
              </div>
            ))}
          </div>
          {/* Clinician photos */}
          <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 12 }}>
            {[1,2,3].map(i => (
              <div key={i} className="wf-img" style={{ width: 36, height: 36, borderRadius: '50%', border: '2px solid white' }} />
            ))}
            <div className="wf-text-sm" style={{ width: 140, height: 6, marginBottom: 0, marginLeft: 6 }} />
          </div>
          {/* CTA #2 */}
          <div className="wf-box-cta" style={{ padding: '10px 0', borderRadius: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div className="wf-text" style={{ width: '55%', height: 8, marginBottom: 0, background: '#6A8870' }} />
          </div>
          <div style={{ marginTop: 5 }}>
            <WF.TextLine width="40%" style={{ height: 5, margin: '0 auto' }} />
          </div>
        </div>
      </WF.Row>

      {/* PDF note */}
      <div style={{ marginTop: 12, padding: 12, background: '#F4F2EE', borderRadius: 8, fontSize: 10, color: '#8A7A6A', lineHeight: 1.6 }}>
        <strong>PDF structure:</strong> A4 / US Letter compatible. Pages 1-3: report content. Page 4: Questions-to-ask checklist (tear-off).<br/>
        <strong>CTA count:</strong> Appears at  (mid-page, after stage + domains) and  (foot, after trust markers). Once in V1.
      </div>
    </div>
  );
}

// --- Clinical Review Panel -------------------------------------------------
function ReviewPanel() {
  const items = [
    { section: 'V1 / V2 -- Opener', copy: '"most caregivers notice signs 1-2 years before a formal diagnosis"', risk: 'Statistic requires citation or softening to "research suggests"', severity: 'medium' },
    { section: 'V2 -- Differential ', copy: 'All 6 condition names + plain-English descriptions', risk: 'Differential framing (even when qualified) may constitute diagnostic language. Legal review needed.', severity: 'high' },
    { section: 'V2 -- Why acting now ', copy: '"lost treatment window for reversible causes"', risk: 'Implication of time-sensitive treatment risk needs clinical sign-off on specificity.', severity: 'high' },
    { section: 'V2 -- Why acting now ', copy: '"Safety concerns" as a risk of waiting', risk: 'Without clinical qualification, this may create undue alarm. Needs framing guidance.', severity: 'medium' },
    { section: 'V1 / V2 -- Stage spectrum', copy: 'Stage labels: Normal Aging  Early Changes  Mild Impairment  Moderate  Advanced', risk: 'Label alignment with DSM-5/ICD-11 clinical staging should be confirmed.', severity: 'medium' },
    { section: 'V2 -- Footer trust', copy: '"[N] caregivers helped" count', risk: 'Placeholder -- must be real, auditable number before launch.', severity: 'low' },
    { section: 'V1 / V2 -- Domain cards', copy: 'Quoted behaviors drawn from quiz answers', risk: 'Low risk; reflective of caregiver input. Confirm language is non-diagnostic.', severity: 'low' },
    { section: 'Both -- "Not a diagnosis" disclaimer', copy: 'Disclaimer position and legal language', risk: 'HIPAA + FTC health claim rules apply. Legal review of exact disclaimer wording required.', severity: 'high' },
  ];
  const colors = { high: { bg: '#FEF0ED', border: '#DFA89E', badge: '#7A2E1F' }, medium: { bg: '#FDF3E8', border: '#F0C07A', badge: '#7A4A10' }, low: { bg: '#EEF5F0', border: '#B8D9C1', badge: '#2A5A3A' } };

  return (
    <div style={{ width: 500, padding: '20px 18px', background: '#FAFAF8' }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: '#3A2A1A', marginBottom: 4 }}> Clinician Review Required</div>
      <div style={{ fontSize: 11, color: '#8A7A6A', marginBottom: 14, lineHeight: 1.5 }}>
        Items below must be reviewed by a licensed clinician and/or legal counsel before any version goes live.
        <strong style={{ color: '#7A2E1F' }}> High-severity items block launch.</strong>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {items.map((item, i) => {
          const c = colors[item.severity];
          return (
            <div key={i} style={{ background: c.bg, border: `1px solid ${c.border}`, borderRadius: 10, padding: '10px 12px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 4 }}>
                <div style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: '#8A7A6A' }}>{item.section}</div>
                <span style={{
                  padding: '2px 8px', borderRadius: 9999, fontSize: 8, fontWeight: 700,
                  textTransform: 'uppercase', letterSpacing: '0.12em',
                  background: c.bg, border: `1px solid ${c.border}`, color: c.badge, flexShrink: 0, marginLeft: 8
                }}>{item.severity}</span>
              </div>
              <div style={{ fontSize: 11, fontStyle: 'italic', color: '#3A2A1A', marginBottom: 4 }}>"{item.copy}"</div>
              <div style={{ fontSize: 11, color: '#5A5040', lineHeight: 1.5 }}> {item.risk}</div>
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 14, padding: '10px 12px', background: '#F4F2EE', borderRadius: 8, fontSize: 10, color: '#8A7A6A', lineHeight: 1.6 }}>
        <strong>Copy test applied:</strong> "Would this feel intrusive if the caregiver's loved one read it over their shoulder?" -- All domain card quotes are framed as caregiver observations, not judgments about the loved one. Stage labels avoid medical-sounding severity language. Differential section uses "this <em>could</em> be" not "this <em>is</em>" framing.
      </div>
    </div>
  );
}

// --- Style Guide panel ----------------------------------------------------
function StyleGuide() {
  return (
    <div style={{ width: 380, padding: '20px 18px', background: '#FAFAF8' }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: '#3A2A1A', marginBottom: 14 }}>Report Style Guide Tokens</div>

      {/* Colors */}
      <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: '#8A7A6A', marginBottom: 8 }}>Color System</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5, marginBottom: 14 }}>
        {[
          { name: '--rpt-bg', hex: '#FDFBF7', label: 'Page background' },
          { name: '--rpt-surface', hex: '#F3EFE9', label: 'Card surface' },
          { name: '--rpt-border', hex: '#E8DCC4', label: 'Borders / dividers' },
          { name: '--rpt-forest', hex: '#3D4B3E', label: 'Primary -- headings, CTA' },
          { name: '--rpt-clay', hex: '#A67B5B', label: 'Accent -- labels, icons' },
          { name: '--rpt-low', hex: '#4A9060', label: 'Concern: Low' },
          { name: '--rpt-moderate', hex: '#C4813A', label: 'Concern: Moderate' },
          { name: '--rpt-elevated', hex: '#A84232', label: 'Concern: Elevated (warm terracotta -- NOT red)' },
        ].map(c => (
          <div key={c.name} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <div style={{ width: 24, height: 24, borderRadius: 5, background: c.hex, border: '1px solid #D8D0C4', flexShrink: 0 }} />
            <div>
              <div style={{ fontSize: 9, fontFamily: 'monospace', color: '#3A2A1A', fontWeight: 700 }}>{c.name}</div>
              <div style={{ fontSize: 8, color: '#8A7A6A' }}>{c.label}</div>
            </div>
            <div style={{ marginLeft: 'auto', fontSize: 9, fontFamily: 'monospace', color: '#A09080' }}>{c.hex}</div>
          </div>
        ))}
      </div>

      {/* Type */}
      <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: '#8A7A6A', marginBottom: 8 }}>Typography</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
        {[
          { role: 'Display / Openers', spec: 'Playfair Display, italic, 18-22px', note: 'Emotional headers' },
          { role: 'Section headings', spec: 'Playfair Display, 15-18px', note: 'Card titles' },
          { role: 'Body', spec: 'DM Sans, 16px, lh 1.65', note: 'All body copy -- min 16px' },
          { role: 'Body small', spec: 'DM Sans, 14px, lh 1.65', note: 'Supplementary text' },
          { role: 'Labels / caps', spec: 'DM Sans, 700, 9-11px, 0.15-0.25em', note: 'Section labels, badges' },
          { role: 'PDF minimum', spec: '11pt body / 9pt labels', note: 'Print-safe minimum' },
        ].map(t => (
          <div key={t.role} style={{ padding: '6px 8px', background: '#F4F2EE', borderRadius: 6 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: '#3A2A1A', marginBottom: 2 }}>{t.role}</div>
            <div style={{ fontSize: 9, fontFamily: 'monospace', color: '#6A5A4A', marginBottom: 1 }}>{t.spec}</div>
            <div style={{ fontSize: 8, color: '#9A8A7A' }}>{t.note}</div>
          </div>
        ))}
      </div>

      {/* Radius */}
      <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: '#8A7A6A', marginBottom: 8 }}>Corner Radii (Report)</div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
        {[{ r: 10, name: 'Inline badge' }, { r: 14, name: 'Info row' }, { r: 18, name: 'Domain card' }, { r: 24, name: 'Section card' }, { r: 9999, name: 'CTA / pill', w: 48 }].map(s => (
          <div key={s.name} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <div style={{ width: s.w || 36, height: 28, background: '#D4CFC8', borderRadius: s.r, border: '1.5px solid #C0B8AE' }} />
            <div style={{ fontSize: 8, color: '#8A7A6A', textAlign: 'center', lineHeight: 1.4 }}>{s.name}</div>
          </div>
        ))}
      </div>

      {/* Concern levels */}
      <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: '#8A7A6A', marginBottom: 8 }}>Concern Level Tokens</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        {[
          { label: 'Low', bg: '#EEF5F0', border: '#B8D9C1', text: '#2A5A3A', dot: '#4A9060' },
          { label: 'Moderate', bg: '#FDF3E8', border: '#F0C07A', text: '#7A4A10', dot: '#C4813A' },
          { label: 'Elevated', bg: '#FBF0ED', border: '#DFA89E', text: '#7A2E1F', dot: '#A84232' },
        ].map(c => (
          <div key={c.label} style={{ background: c.bg, border: `1px solid ${c.border}`, borderRadius: 8, padding: '6px 10px', display: 'flex', gap: 8, alignItems: 'center' }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: c.dot }} />
            <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.15em', color: c.text }}>{c.label} concern</div>
            <div style={{ marginLeft: 'auto', fontSize: 8, fontFamily: 'monospace', color: c.text, opacity: 0.7 }}>{c.bg}</div>
          </div>
        ))}
        <div style={{ fontSize: 9, color: '#9A8A7A', fontStyle: 'italic', marginTop: 2 }}>
          Note: No pure red (#FF0000-range) used. Elevated uses warm terracotta (#A84232) per brief.
        </div>
      </div>
    </div>
  );
}

  return (
