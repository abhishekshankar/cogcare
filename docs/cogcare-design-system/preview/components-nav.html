<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--color-bg); font-family: var(--font-sans); }
  .group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-clay); margin-bottom: 10px; margin-top: 16px; }
</style>
</head>
<body>

<div class="group-label">Site Header (scrolled)</div>
<div style="background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-bottom:1px solid #E8DCC4;padding:12px 20px;border-radius:12px;display:flex;align-items:center;justify-content:space-between">
  <div style="display:flex;align-items:center;gap:8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A67B5B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5a3 3 0 1 0-5.997-.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997-.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    </svg>
    <span style="font-family:var(--font-serif);font-size:18px;color:#3D4B3E;letter-spacing:-0.02em">Cog<em style="font-style:italic">Care</em><span style="font-family:var(--font-sans);font-size:12px;font-weight:500;color:#A67B5B;opacity:0.8;margin-left:1px">.org</span></span>
  </div>
  <nav style="display:flex;align-items:center;gap:16px">
    <a style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#3D4B3E;text-decoration:none">Education</a>
    <a style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#3D4B3E;text-decoration:none">Blog</a>
    <a style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#3D4B3E;text-decoration:none">Get Inside</a>
    <a style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:white;background:#3D4B3E;padding:8px 16px;border-radius:9999px;text-decoration:none">Donate</a>
  </nav>
</div>

<div class="group-label">Dashboard Tab Bar</div>
<div style="border-bottom:1px solid #E8DCC4;display:flex;gap:0;overflow-x:auto;background:white">
  <a style="padding:14px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#3D4B3E;border-bottom:2px solid #3D4B3E;text-decoration:none;white-space:nowrap">Brain Credit</a>
  <a style="padding:14px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:rgba(61,75,62,0.5);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap">My Tests</a>
  <a style="padding:14px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:rgba(61,75,62,0.5);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap">More Tests</a>
  <a style="padding:14px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:rgba(61,75,62,0.5);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap">Consultations</a>
  <a style="padding:14px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:rgba(61,75,62,0.5);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap">⚙ Settings</a>
</div>

<div class="group-label">Panel Header Pattern</div>
<div style="max-width:420px">
  <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.25em;color:rgba(61,75,62,0.5);margin-bottom:6px">Overview</div>
  <div style="font-family:var(--font-serif);font-size:1.75rem;font-style:italic;color:#3D4B3E;line-height:1.2">Brain credit</div>
  <p style="font-size:13px;color:#64748B;line-height:1.6;margin-top:8px;margin-bottom:0">A single score derived from your Brain Health Index. Higher reflects a stronger "normal aging" pattern.</p>
</div>
</body>
</html>
